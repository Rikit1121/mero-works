<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Mero Works</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <meta name="theme-color" content="#1f1f29" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .not-found {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--color-night-sky);
      text-align: center;
      padding: var(--spacing-32);
    }
    .not-found__inner { max-width: 520px; }
    .not-found__code {
      font-family: var(--font-ppmondwest);
      font-size: clamp(80px, 18vw, 160px);
      line-height: 1;
      color: var(--color-action-azure);
      opacity: .3;
      letter-spacing: -0.04em;
    }
    .not-found__title {
      font-family: var(--font-ppmondwest);
      font-size: clamp(26px, 5vw, 40px);
      color: var(--color-canvas-white);
      letter-spacing: -0.02em;
      margin-bottom: var(--spacing-16);
    }
    .not-found__body { color: rgba(255,255,255,0.6); font-size: var(--text-subheading); line-height: 1.5; margin-bottom: var(--spacing-32); }
    .not-found__actions { display: flex; gap: var(--spacing-12); justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="not-found" role="main">
    <div class="not-found__inner">
      <p class="not-found__code" aria-hidden="true">404</p>
      <h1 class="not-found__title">Page not found</h1>
      <p class="not-found__body">The page you're looking for doesn't exist or has been moved. Let's get you somewhere useful.</p>
      <div class="not-found__actions">
        <a href="index.html" class="btn btn--light btn--lg">Back to home</a>
        <a href="projects/index.html" class="btn btn--ghost-light btn--lg">View Projects</a>
      </div>
    </div>
  </div>
</body>
</html>
